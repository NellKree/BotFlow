# config.yaml

data:
  input_path: "data/raw_data.csv"
  output_path: "data/processed_data.parquet"

features:
  categorical:
    - platform
    - account_type
  numerical:
    - post_frequency
    - avg_post_length
    - interaction_density
    - activity_regularity
    - unique_interactions_count
    - avg_time_between_actions
  text_fields:
    - cleaned_text
  datetime_fields:
    - last_active
    - created_at

target_column: is_bot

models:
  random_forest:
    n_estimators: 200
    max_depth: 10
    class_weight: balanced
  xgboost:
    n_estimators: 300
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.7
    eval_metric: logloss
    use_label_encoder: false
  logistic_regression:
    penalty: l2
    solver: lbfgs
    max_iter: 500
    class_weight: balanced

validation:
  test_size: 0.2
  cv_folds: 5
  scoring_metrics:
    - accuracy
    - precision
    - recall
    - f1